services:
  db:
    image: pgvector/pgvector:pg17
    container_name: needle-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: needle
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - needle_pgdata:/var/lib/postgresql/data

volumes:
  needle_pgdata: